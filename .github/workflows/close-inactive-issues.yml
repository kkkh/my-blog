name: Close inactive issues

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  close-issues:
    if: github.repository == 'kkkh/my-blog'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 14
          days-before-close: 7
          days-before-pr-close: -1
          stale-issue-label: 'stale'
          stale-issue-message: '此 issue 已 14 天无活动，将被标记为过时。如需继续处理请留言，否则 7 天后自动关闭。'
          stale-pr-message: '这个 PR 已开启 14 天且无活动，将被标记为过时。'
          close-issue-message: '此 issue 自被标记为过时后已 7 天无活动，因此已自动关闭。'

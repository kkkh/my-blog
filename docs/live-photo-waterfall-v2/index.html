<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>实况瀑布流相册 v2 — HeoLivePhoto + Fancybox 6（DOM 解耦 / 懒加载 / 原生比例）</title>

    <!-- ════════════════════════════════════════════════════════════════════════════
  ① 依赖引入
  ──────────────────────────────────────────────────────────────────────────────
  · HeoLivePhoto（lib/heolivephoto.js）—— 本目录自带的「补丁版」：
      原版 IIFE 会在加载时对整个 document 自动 scan()，并对所有 img[src$=".jpg"]
      做 Motion Photo 探测（整份 fetch）。只要有 .jpg 封面，懒加载就被击穿。
      补丁仅删除 IIFE 末尾的自动 scan 调用，保留 window.HeoLivePhoto 导出，
      改由下方 IntersectionObserver 按需调用 scan(item)。升级 Heo 请重新打补丁。
  · Fancybox 6（../../public/fancybox/fancybox.min.css + fancybox.umd.min.js）—— 灯箱。
      引用项目共享的本地化副本（相对路径，避免广告拦截/跟踪防护静默拦截 CDN）。
      独立部署时把这两个文件复制到本目录或任意同源路径，改下面两行即可。
  两者均为原生 JS、零依赖，不需要 jQuery，也不需要 Masonry（瀑布流是纯 CSS column）。
  顺序：两个依赖必须在页面底部那段初始化脚本之前加载完成。
════════════════════════════════════════════════════════════════════════════ -->
    <link rel="stylesheet" href="../../public/fancybox/fancybox.min.css" />

    <!-- ════════════════════════════════════════════════════════════════════════════
  ② 样式：CSS 原生多列瀑布流
════════════════════════════════════════════════════════════════════════════ -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: #f4f5f2;
        color: #1c1c1e;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #10131a;
          color: #f2f2f0;
        }
      }

      .lp-page {
        max-width: 1160px;
        margin: 0 auto;
        padding: 32px 16px 80px;
      }
      .lp-head h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
      }
      .lp-head p {
        margin: 0 0 24px;
        font-size: 0.875rem;
        opacity: 0.6;
      }

      /* -------- 瀑布流容器：CSS column 布局，列数响应式 --------
     桌面 3 列 / 平板 2 列 / 手机 1 列；列间距 16px。
     不能用 column-fill:auto（容器无明确高度时 Chrome 会把所有图堆进第一列）；
     用默认 balance 让图片平衡分布到各列，才是瀑布流多列。 */
      .lp-waterfall {
        column-count: 3;
        column-gap: 16px;
      }
      @media (max-width: 768px) {
        .lp-waterfall {
          column-count: 2;
        }
      } /* 平板 2 列 */
      @media (max-width: 480px) {
        .lp-waterfall {
          column-count: 1;
        }
      } /* 手机 1 列 */

      /* -------- 单个相册项 --------
     必须块级 + break-inside:avoid，否则 CSS column 会把图片拦腰截断到下一列。
     overflow:hidden 配合圆角，并裁掉 Heo 播放时 scale(1.1) 的外溢。 */
      .lp-item {
        position: relative;
        display: block;
        width: 100%;
        margin: 0 0 16px;
        padding: 0;
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        background: rgba(120, 130, 150, 0.14);
        break-inside: avoid;
        -webkit-column-break-inside: avoid;
        page-break-inside: avoid;
        text-decoration: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        outline-offset: 3px;
        transition:
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s ease;
      }
      .lp-item:hover,
      .lp-item:focus-visible {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
      }

      /* -------- 兼容 HeoLivePhoto 自动生成的匿名包裹层 --------
     Heo 运行时会把 <img> 包进一个 <span>（无 class）并写 inline 样式：
       display:inline-block; max-width:100%; line-height:0; ...
     inline 样式压过普通 CSS，所以这里必须 !important；且选择器不能带自定义类名
     （那个 span 没有 class）。关键：高度自适应，绝不强制固定高度 → 无裁切。 */
      .lp-item > span {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        max-width: 100% !important;
        overflow: hidden !important;
        line-height: 0;
      }

      /* -------- 实况图：严格按原始比例渲染，无裁切、无拉伸 --------
     只设 width:100% + height:auto + object-fit:contain。
     绝不设 height / aspect-ratio / object-fit:cover，才不会裁切或拉伸。
     高度完全由图片 intrinsic 尺寸决定 → 瀑布流高低不一、宽窄自然。 */
      .lp-item .live-photo {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        max-width: 100% !important;
        object-fit: contain !important;
        margin: 0 !important;
        vertical-align: bottom;
        -webkit-user-drag: none;
      }

      /* ════════════════════════════════════════════════════════════════════════════
     灯箱内的实况播放器（内容由 JS 在 contentReady 阶段从 data-* 动态注入）
  ═════════════════════════════════════════════════════════════════════════════ */
      .lp-player {
        position: relative;
        display: block;
        margin: 0 auto;
        line-height: 0;
        background: #000;
        min-width: 220px;
        min-height: 140px;
      }
      /* 封面：contain 保比例不裁；max-width/max-height 仅限制显示尺寸 */
      .lp-cover {
        display: block;
        max-width: min(92vw, 1280px);
        max-height: min(86vh, 980px);
        width: auto;
        height: auto;
        object-fit: contain;
        margin: 0;
        border: 0;
        /* 放大后动效：视频解码前对封面做缓慢 Ken Burns，避免「放大后是一张死图」 */
        animation: lp-kenburns 8s ease-out forwards;
        transform-origin: center center;
      }
      @keyframes lp-kenburns {
        0% {
          transform: scale(1.02);
        }
        100% {
          transform: scale(1.12);
        }
      }
      /* 视频：绝对覆盖封面，解码完成前透明（继续显示封面，避免黑屏闪烁） */
      .lp-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        margin: 0;
        border: 0;
        background: #000;
        opacity: 1;
        transition: opacity 0.25s ease;
      }
      .lp-video.is-waiting {
        opacity: 0;
      }

      .lp-spin {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.28);
        border-top-color: #fff;
        animation: lp-spin 0.8s linear infinite;
        pointer-events: none;
      }
      @keyframes lp-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .lp-caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 10px 14px;
        font-size: 0.85rem;
        line-height: 1.4;
        color: #fff;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
        pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .lp-item,
        .lp-video {
          transition: none;
        }
        .lp-cover {
          animation: none;
        }
        .lp-spin {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>

  <body>
    <div class="lp-page">
      <header class="lp-head">
        <h1>实况瀑布流相册</h1>
        <p>桌面悬浮播放 · 手机长按播放 · 点击放大播放 · 左右滑动切换 · DOM 解耦 · 懒加载</p>
      </header>

      <!-- ════════════════════════════════════════════════════════════════════════════
    ③ HTML 结构（含 3 个示例相册项）
    ──────────────────────────────────────────────────────────────────────────────
    每个相册项是一个 <a>，注意三点：
      1) 不要写 href —— Fancybox 会把 href 当作品素材来源（# 开头的还会被当成
         页面内元素克隆）。这里素材一律走 data-*，<a> 保持无 href，用
         role="button" + tabindex="0" 补上键盘可访问性（Enter/Space 由脚本接管）。
      2) data-fancybox="live-gallery" —— 分组键，同组内可左右滑动切换（必填）。
      3) 三个素材属性（DOM 解耦的契约，Fancybox 只从这里读素材，绝不读缩略图 DOM）：
           data-pvt    —— 单文件实况图 .pvt（ZIP：封面 JPEG + MP4/MOV）
           data-cover  —— 静态封面（缩略图与灯箱共用，保证秒开不空白、瀑布流不跳动）
           data-video  —— 动态视频 MP4/MOV（留空则回退到解包 data-pvt）
         优先级：data-video > 解包 data-pvt > 仅 data-cover（静态）。
         本页 3 个示例均为 .pvt 形态（data-video 留空），素材来自
         src/content/galleries/person-life/，需在仓库根起静态服务器解析相对路径。

    内部 <img>：
      · class="live-photo" —— HeoLivePhoto 识别目标。
      · src 指向 data-cover（静态封面）—— 保证瀑布流有 intrinsic 尺寸、无破图闪烁。
      · data-live-pvt 指向 .pvt —— Heo 据此解出封面 blob + 视频 blob 并接管播放。
        （Heo 也识别 img[src$=".pvt"]，但用 .pvt 做 src 浏览器无法渲染、会破图且
         布局塌陷，故这里用 data-cover 做 src + data-live-pvt 标记，效果等价、UX 更好。）
      Heo 初始化后会把 <img> 包进匿名 <span> 并改 inline 样式 —— 这完全不影响
      Fancybox（Fancybox 的内容由 data-* 在灯箱内重新生成，与缩略图 DOM 无关）。
  ═════════════════════════════════════════════════════════════════════════════ -->
      <div class="lp-waterfall" id="lpWaterfall">
        <a
          class="lp-item"
          role="button"
          tabindex="0"
          data-fancybox="live-gallery"
          data-pvt="../../src/content/galleries/person-life/1000015643.pvt"
          data-cover="../../src/content/galleries/person-life/1000015643.jpg"
          data-video=""
          data-caption="一个人的生活才是常态 · 01"
        >
          <img
            class="live-photo"
            src="../../src/content/galleries/person-life/1000015643.jpg"
            data-live-pvt="../../src/content/galleries/person-life/1000015643.pvt"
            alt="实况照片 01"
          />
        </a>

        <a
          class="lp-item"
          role="button"
          tabindex="0"
          data-fancybox="live-gallery"
          data-pvt="../../src/content/galleries/person-life/1000015644.pvt"
          data-cover="../../src/content/galleries/person-life/1000015644.jpg"
          data-video=""
          data-caption="一个人的生活才是常态 · 02"
        >
          <img
            class="live-photo"
            src="../../src/content/galleries/person-life/1000015644.jpg"
            data-live-pvt="../../src/content/galleries/person-life/1000015644.pvt"
            alt="实况照片 02"
          />
        </a>

        <a
          class="lp-item"
          role="button"
          tabindex="0"
          data-fancybox="live-gallery"
          data-pvt="../../src/content/galleries/person-life/1000015645.pvt"
          data-cover="../../src/content/galleries/person-life/1000015645.jpg"
          data-video=""
          data-caption="一个人的生活才是常态 · 03"
        >
          <img
            class="live-photo"
            src="../../src/content/galleries/person-life/1000015645.jpg"
            data-live-pvt="../../src/content/galleries/person-life/1000015645.pvt"
            alt="实况照片 03"
          />
        </a>
      </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════════════════
  ④ 依赖脚本 + ⑤ JS 逻辑
  两个依赖脚本都排在这段初始化脚本之前、且不是 async/defer，走到这里时
  window.Fancybox / window.HeoLivePhoto 已就位，可直接同步初始化。
════════════════════════════════════════════════════════════════════════════ -->
    <script src="lib/heolivephoto.js"></script>
    <script src="../../public/fancybox/fancybox.umd.min.js"></script>

    <script>
      ;(function () {
        'use strict'

        // ──────────────────────────────────────────────────────────────────────────
        // 0. 常量与工具
        // ──────────────────────────────────────────────────────────────────────────
        var GROUP = 'live-gallery'
        var SELECTOR = '[data-fancybox="' + GROUP + '"]'
        // Heo 长按阈值是 260ms；这里用 300ms 作为「长按」判定，刚好略高于其阈值，
        // 确保被判为长按的触摸 Heo 一定已经开始/即将开始播放。
        var LONG_PRESS_MS = 300

        function escapeAttr(value) {
          return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
          })
        }
        function absolutize(url) {
          try {
            return new URL(url, document.baseURI).href
          } catch (e) {
            return url
          }
        }

        // ──────────────────────────────────────────────────────────────────────────
        // 1. 最小 .pvt 解包器（零依赖 ZIP 解析）
        //    .pvt = ZIP 包（封面 JPEG + 视频 MP4/MOV）。灯箱要播视频、而作者只给了
        //    data-pvt 没给 data-video 时，就得自己解一次。解出的 objectURL 会缓存，
        //    同一文件全页只下载解析一次（浏览器 HTTP 缓存也会命中缩略图已下的那份）。
        //    本段与 HeoLivePhoto 内部的 extractPvt 算法一致，已逐字节验证通过。
        // ──────────────────────────────────────────────────────────────────────────
        var pvtCache = Object.create(null)

        function unpackPvt(url) {
          if (pvtCache[url]) return pvtCache[url]

          var task = fetch(url)
            .then(function (response) {
              if (!response.ok) throw new Error('.pvt HTTP ' + response.status)
              return response.arrayBuffer()
            })
            .then(function (buffer) {
              var bytes = new Uint8Array(buffer)
              var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength)
              var tail = -1

              // 从文件尾部反向找 EOCD（End of Central Directory）记录
              for (var i = bytes.length - 22; i >= Math.max(0, bytes.length - 65558); i--) {
                if (view.getUint32(i, true) === 0x06054b50) {
                  tail = i
                  break
                }
              }
              if (tail < 0) throw new Error('.pvt 不是合法的 zip 包')

              var entries = view.getUint16(tail + 10, true)
              var cursor = view.getUint32(tail + 16, true)
              var decoder = new TextDecoder()
              var cover = null,
                video = null

              for (var n = 0; n < entries; n++) {
                var method = view.getUint16(cursor + 10, true)
                var csize = view.getUint32(cursor + 20, true)
                var nameLen = view.getUint16(cursor + 28, true)
                var extraLen = view.getUint16(cursor + 30, true)
                var commentLen = view.getUint16(cursor + 32, true)
                var localHead = view.getUint32(cursor + 42, true)
                var name = decoder.decode(bytes.subarray(cursor + 46, cursor + 46 + nameLen))
                cursor += 46 + nameLen + extraLen + commentLen

                var base = name.split('/').pop() || ''
                if (!cover && /\.(jpe?g|webp|png)$/i.test(base)) {
                  cover = { method: method, head: localHead, size: csize }
                } else if (!video && /\.(mp4|mov)$/i.test(base)) {
                  video = { method: method, head: localHead, size: csize }
                }
                if (cover && video) break
              }
              if (!cover || !video) throw new Error('.pvt 内没有封面或视频')

              function extract(entry) {
                var start =
                  entry.head +
                  30 +
                  view.getUint16(entry.head + 26, true) +
                  view.getUint16(entry.head + 28, true)
                var data = bytes.subarray(start, start + entry.size)
                if (entry.method === 0) return Promise.resolve(new Blob([data]))
                if (entry.method === 8 && typeof DecompressionStream === 'function') {
                  return new Response(
                    new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')),
                  ).blob()
                }
                return Promise.reject(new Error('不支持的 zip 压缩方式 ' + entry.method))
              }

              return Promise.all([extract(cover), extract(video)]).then(function (parts) {
                return {
                  cover: URL.createObjectURL(parts[0]),
                  video: URL.createObjectURL(parts[1]),
                }
              })
            })

          pvtCache[url] = task
          task.catch(function () {
            delete pvtCache[url]
          })
          return task
        }

        // ──────────────────────────────────────────────────────────────────────────
        // 2. 相册项收集 + 空骨架注入
        //    收集所有 <a>，给每个分配唯一 id，建立 itemMap（id → 触发元素）。
        //    关键：给每个 <a> 写一个 data-html，内容是「空的播放器骨架」
        //    <div class="lp-player" data-lp-id="N"></div> —— 骨架里没有任何素材，
        //    素材稍后在 contentReady 阶段从触发元素的 dataset 动态注入。
        //    Fancybox 6 会把元素的所有 data-* 映射成 slide 选项（data-html → html 选项），
        //    Html 插件据此把骨架渲染进 slide，并触发 Carousel.contentReady 事件。
        // ──────────────────────────────────────────────────────────────────────────
        var items = Array.prototype.slice.call(document.querySelectorAll(SELECTOR))
        var itemMap = Object.create(null)

        function buildShellHtml(itemId) {
          // 骨架只有定位容器 + id 标记；封面/视频一律不在这里写死
          return '<div class="lp-player" data-lp-id="' + escapeAttr(itemId) + '"></div>'
        }

        function prepareItems() {
          items.forEach(function (item, index) {
            var id = item.id || (item.id = 'lp-item-' + index)
            itemMap[id] = item
            // data-html 是「自定义 HTML 内容」的声明；空骨架满足 Fancybox 触发 contentReady
            if (!item.dataset.html) item.dataset.html = buildShellHtml(id)
          })
        }

        // ──────────────────────────────────────────────────────────────────────────
        // 3. 灯箱素材解析（唯一入口，全部来自 data-*，绝不读缩略图 DOM）
        //    优先级：
        //      ① data-video             —— 作者显式给的视频（最省、<video> 不需要 CORS）
        //      ② 解包 data-pvt           —— 带缓存，重复打开不重复下载
        //      ③ 仅 data-cover           —— 静态封面（无视频）
        //    这是「DOM 解耦」的核心：灯箱从不碰缩略图里 Heo 改写过的 <img>/<video>。
        // ──────────────────────────────────────────────────────────────────────────
        function resolveAssets(item) {
          var cover = item.getAttribute('data-cover')
          var video = item.getAttribute('data-video')
          var pvt = item.getAttribute('data-pvt')
          var coverAbs = cover ? absolutize(cover) : null

          if (video) return Promise.resolve({ cover: coverAbs, video: absolutize(video) })

          if (pvt) {
            return unpackPvt(absolutize(pvt)).then(function (parts) {
              return { cover: parts.cover || coverAbs, video: parts.video }
            })
          }

          return Promise.resolve({ cover: coverAbs, video: null })
        }

        // ──────────────────────────────────────────────────────────────────────────
        // 4. 实况播放器：封面打底（带 Ken Burns 动效）+ 视频覆盖，解码前保持封面可见
        // ──────────────────────────────────────────────────────────────────────────
        var activePlayers = [] // { player, video, slide } 当前已挂载的播放器
        var currentPlayer = null

        function isCurrentSlide(player) {
          // Fancybox 给当前 slide 加 is-selected 类（源码 we(slideEl, classes.isSelected)）
          return !!(player.closest && player.closest('.is-selected'))
        }

        function showSpin(player) {
          if (player.querySelector('.lp-spin')) return
          var spin = document.createElement('div')
          spin.className = 'lp-spin'
          player.append(spin)
        }
        function hideSpin(player) {
          var spin = player.querySelector('.lp-spin')
          if (spin) spin.parentNode.removeChild(spin)
        }

        function setCover(player, url, caption) {
          var img = player.querySelector('.lp-cover')
          if (!img) {
            img = document.createElement('img')
            img.className = 'lp-cover'
            img.alt = ''
            player.insertBefore(img, player.firstChild)
          }
          if (img.getAttribute('src') !== url) img.setAttribute('src', url)
          if (caption && !player.querySelector('.lp-caption')) {
            var cap = document.createElement('div')
            cap.className = 'lp-caption'
            cap.textContent = caption
            player.append(cap)
          }
        }

        function attachVideo(player, url) {
          var node = document.createElement('video')
          node.className = 'lp-video is-waiting'
          // 移动端自动播放的三件套：muted + playsinline + autoplay
          node.muted = true
          node.setAttribute('muted', '')
          node.setAttribute('autoplay', '')
          node.setAttribute('loop', '')
          node.setAttribute('playsinline', '')
          node.playsInline = true
          node.loop = true
          node.preload = 'auto'
          node.src = url

          // 解码就绪后淡入视频、停掉转圈
          node.addEventListener('canplay', function onReady() {
            node.removeEventListener('canplay', onReady)
            node.classList.remove('is-waiting')
            hideSpin(player)
          })
          node.addEventListener('error', function () {
            hideSpin(player)
          })

          player.append(node)

          var record = { player: player, video: node }
          activePlayers.push(record)

          // 只让「当前 slide」自动播放，其余静音挂载（预加载，便于左右切换）
          if (isCurrentSlide(player)) {
            var p = node.play()
            if (p && p.catch)
              p.catch(function () {
                /* 自动播放被拦则静默降级为封面 */
              })
          }
        }

        function resumeVideo(record) {
          // 切走再切回时，视频节点还在，重新登记并续播
          if (
            !activePlayers.some(function (r) {
              return r.player === record.player
            })
          ) {
            activePlayers.push(record)
          }
          record.video.classList.add('is-waiting')
          showSpin(record.player)
          try {
            record.video.currentTime = 0
          } catch (e) {}
          var p = record.video.play()
          if (p && p.catch) {
            p.then(
              function () {
                record.video.classList.remove('is-waiting')
                hideSpin(record.player)
              },
              function () {
                record.video.classList.remove('is-waiting')
                hideSpin(record.player)
              },
            )
          }
        }

        // 灯箱一开就暂停缩略图上的 Heo 播放（避免在遮罩底下继续跑）。
        // 缩略图视频是静音的，影响仅 CPU；但鼠标点击打开灯箱时 hover 可能仍在播。
        // Heo 把控制句柄挂在 wrap._heoLiveCtrl，reset 即可停。
        function pauseThumbnailPlayback(item) {
          try {
            var img = item.querySelector('img.live-photo')
            if (img && img.parentNode && img.parentNode._heoLiveCtrl) {
              window.HeoLivePhoto.reset(img.parentNode)
            }
          } catch (e) {}
        }

        // 把播放器挂到 slide 上（contentReady / attachSlideEl 的统一入口）
        function mountLivePlayer(player, item) {
          pauseThumbnailPlayback(item) // contentReady 一定触发 → 这里暂停最可靠

          // 已经挂过视频 → 续播即可，不重复创建
          var existingVideo = player.querySelector('.lp-video')
          if (existingVideo) {
            resumeVideo({ player: player, video: existingVideo })
            return
          }

          var cover = item.getAttribute('data-cover')
          var caption = item.getAttribute('data-caption') || ''

          // 先把封面铺上（秒开），再异步解析视频
          if (cover) setCover(player, absolutize(cover), caption)
          showSpin(player)

          resolveAssets(item)
            .then(function (assets) {
              if (!player.isConnected) return // slide 已被切掉丢弃
              if (assets.cover) setCover(player, assets.cover, caption)
              if (assets.video) attachVideo(player, assets.video)
              else hideSpin(player) // 纯静态图，无视频
            })
            .catch(function (err) {
              hideSpin(player)
              console.error('[live-photo-waterfall] 实况素材加载失败：', err)
            })
        }

        // ──────────────────────────────────────────────────────────────────────────
        // 5. 播放器生命周期：只让当前 slide 播放，切走 / 关闭一律停止
        // ──────────────────────────────────────────────────────────────────────────
        function stopPlayer(record) {
          try {
            if (record.video) {
              record.video.pause()
              record.video.removeAttribute('autoplay')
            }
          } catch (e) {}
          hideSpin(record.player)
        }
        function prunePlayers() {
          for (var i = activePlayers.length - 1; i >= 0; i--) {
            var r = activePlayers[i]
            var keep =
              r.player.isConnected && (r.player === currentPlayer || isCurrentSlide(r.player))
            if (!keep) {
              stopPlayer(r)
              activePlayers.splice(i, 1)
            }
          }
        }
        function stopAll() {
          activePlayers.forEach(stopPlayer)
          activePlayers.length = 0
          currentPlayer = null
        }

        // ──────────────────────────────────────────────────────────────────────────
        // 6. 懒加载初始化 HeoLivePhoto（IntersectionObserver，提前 200px 预加载）
        //    用补丁版 Heo（无自动 scan）后，Heo 自己什么都不会做，全靠这里按需 scan。
        //    scan(item) 只在 item 子树内查找并增强那一张 img → 只 fetch 那一个 .pvt。
        //    初始化完成后 unobserve，避免重复执行。
        // ──────────────────────────────────────────────────────────────────────────
        function initHeoFor(item) {
          var img = item.querySelector('img.live-photo')
          if (!img || img.dataset.liveReady) return
          if (typeof window.HeoLivePhoto === 'undefined' || !window.HeoLivePhoto.scan) {
            console.warn('[live-photo-waterfall] HeoLivePhoto 未加载，缩略图实况播放不可用')
            return
          }
          // scan 接受 root 参数：只在 item 子树内增强，不影响其它项 → 真·懒加载
          window.HeoLivePhoto.scan(item)
        }

        function setupLazyInit() {
          if (!('IntersectionObserver' in window)) {
            items.forEach(initHeoFor) // 不支持 IO 的浏览器直接全量初始化
            return
          }
          var observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (!entry.isIntersecting) return
                initHeoFor(entry.target)
                observer.unobserve(entry.target) // 只初始化一次
              })
            },
            {
              root: null,
              rootMargin: '200px 0px', // 提前 200px 预加载
              threshold: 0,
            },
          )
          items.forEach(function (item) {
            observer.observe(item)
          })
        }

        // ──────────────────────────────────────────────────────────────────────────
        // 7. 点击与长按的时长隔离（移动端）
        //    Heo 长按阈值 260ms：touchstart 后 260ms 才播放。这里用 300ms 判定「长按」，
        //    长按释放后浏览器仍会派发一次 click —— 那次 click 会误开灯箱，是唯一冲突点。
        //    做法：长按（≥300ms 且未移动）后，屏蔽紧随其后的那一次 click。
        //    短点击（<300ms）完全不受影响 → 触发灯箱。这就是「时长天然隔离」。
        //    桌面端无 touch 事件，hover 播放与点击放大天然不冲突。
        // ──────────────────────────────────────────────────────────────────────────
        var touchStartAt = 0
        var touchMoved = false
        var suppressNextClick = false

        document.addEventListener(
          'touchstart',
          function (e) {
            if (!e.target.closest || !e.target.closest(SELECTOR)) return
            touchStartAt = Date.now()
            touchMoved = false
          },
          { passive: true, capture: true },
        )

        document.addEventListener(
          'touchmove',
          function () {
            touchMoved = true
          },
          { passive: true, capture: true },
        )

        ;['touchend', 'touchcancel'].forEach(function (type) {
          document.addEventListener(
            type,
            function (e) {
              if (!e.target.closest || !e.target.closest(SELECTOR)) return
              if (touchStartAt && Date.now() - touchStartAt >= LONG_PRESS_MS && !touchMoved) {
                suppressNextClick = true // 这次是长按 → 屏蔽随后的 click
              }
              touchStartAt = 0
            },
            { passive: true, capture: true },
          )
        })

        // capture 阶段拦下「长按之后那次 click」，阻止它冒泡到 Fancybox 的 body 监听器
        document.addEventListener(
          'click',
          function (e) {
            if (!suppressNextClick) return
            suppressNextClick = false
            if (!e.target.closest || !e.target.closest(SELECTOR)) return
            e.preventDefault()
            e.stopPropagation()
          },
          true,
        )

        // 键盘可访问性：<a> 无 href，自己接管 Enter / Space
        document.addEventListener(
          'keydown',
          function (e) {
            if (e.key !== 'Enter' && e.key !== ' ') return
            if (!e.target.closest || !e.target.closest(SELECTOR)) return
            e.preventDefault()
            e.target.click()
          },
          true,
        )

        // ──────────────────────────────────────────────────────────────────────────
        // 8. Fancybox 自定义灯箱
        //    · Carousel.contentReady —— 单张内容首次挂载（等价于其它库的 done 回调）；
        //      本地化的 Fancybox 6.0.29 没有 done 事件，contentReady 是 slide 内容
        //      就绪的准确钩子（仅当 slide 有 html 选项时触发，我们的 data-html 骨架满足）。
        //    · Carousel.attachSlideEl —— 远端 slide 被重新挂回 DOM（切走再切回）。
        //    · Carousel.change / settle —— 切换 / 滑动稳定后，停掉非当前播放器。
        //    · backdropClick —— 点内容区域不关闭（preventDefault），点遮罩仍关闭。
        //    灯箱内容完全独立生成：从 itemMap[id] 的 dataset 读 cover/video/pvt，
        //    动态注入全屏播放容器，不复用缩略图 DOM（Heo 怎么改写缩略图都不影响灯箱）。
        // ──────────────────────────────────────────────────────────────────────────

        // contentReady / attachSlideEl 的回调参数是 (fancybox, carousel, slide...)，
        // slide 在剩余参数里且版本间位置可能浮动，所以按「有 .el 的那个对象」扫描
        function activateSlide() {
          for (var i = 0; i < arguments.length; i++) {
            var candidate = arguments[i]
            if (!candidate || !candidate.el || !candidate.el.querySelector) continue
            var player = candidate.el.querySelector('.lp-player')
            if (!player) continue // 骨架没找到 → 不是我们的 slide
            currentPlayer = player
            var id = player.getAttribute('data-lp-id')
            var item = itemMap[id]
            if (item) mountLivePlayer(player, item)
            break
          }
          prunePlayers()
        }

        function initFancybox() {
          if (typeof window.Fancybox === 'undefined') {
            console.error('[live-photo-waterfall] Fancybox 未加载，灯箱不可用')
            return
          }

          // 先解绑再绑，防止重复绑定（本页单次初始化用不到，但保持幂等更安全）
          try {
            window.Fancybox.unbind(document.body)
          } catch (e) {}

          window.Fancybox.bind(SELECTOR, {
            hideScrollbar: true,
            backdropClick: 'close', // 默认：点遮罩关闭
            closeButton: 'auto',
            keyboard: { Escape: 'close', ArrowLeft: 'prev', ArrowRight: 'next' },

            Carousel: {
              infinite: true, // 分组内无限循环
              vertical: false, // 左右滑动切换
              adaptiveHeight: true,
              slidesPerPage: 1,
              plugins: { Thumbs: null }, // 实况图不要缩略图条
            },

            on: {
              // 单张内容首次挂载 → 注入实况播放器（done 等价钩子）
              'Carousel.contentReady': activateSlide,
              // 切走再切回 → 重新播放
              'Carousel.attachSlideEl': activateSlide,
              // 切换 / 稳定后停掉非当前播放器
              'Carousel.change': function () {
                prunePlayers()
              },
              'Carousel.settle': function () {
                prunePlayers()
              },

              // 点内容区域不关闭（只拦内容本身，遮罩点击仍正常关闭）
              // 本地化 Fancybox 6.0.29 没有 contentClick 选项，点内容触发的是可
              // preventDefault 取消的 backdropClick 事件
              backdropClick: function (fancybox, event) {
                var t = event.composedPath ? event.composedPath()[0] : event.target
                if (t && t.closest && t.closest('.lp-player')) event.preventDefault()
              },

              close: stopAll,
              destroy: stopAll,
            },
          })
        }

        // ──────────────────────────────────────────────────────────────────────────
        // 9. 初始化入口
        // ──────────────────────────────────────────────────────────────────────────
        function init() {
          if (!items.length) return
          prepareItems() // 建 itemMap + 注入空骨架 data-html
          setupLazyInit() // IntersectionObserver 懒加载 Heo
          initFancybox() // 绑定 Fancybox 自定义灯箱
        }

        init()
      })()
    </script>

    <!-- ════════════════════════════════════════════════════════════════════════════
  ⑥ 使用说明
  ──────────────────────────────────────────────────────────────────────────────

  【依赖引入】
    <link rel="stylesheet" href="../../public/fancybox/fancybox.min.css">
    <script src="lib/heolivephoto.js"></script>          ← 补丁版(见下)
    <script src="../../public/fancybox/fancybox.umd.min.js"></script>
    顺序：两个依赖必须在初始化脚本之前加载完成。
    两者均为原生 JS、零依赖，不需要 jQuery，也不需要 Masonry（瀑布流用纯 CSS column）。
    生产环境建议本地化两个文件，避免广告拦截/跟踪防护静默拦截 CDN。
    ★ HeoLivePhoto 必须用本目录 lib/heolivephoto.js（补丁版）：原版 IIFE 会在加载时
      自动 scan() 全文档并对所有 img[src$=".jpg"] 做 Motion Photo 探测（整份 fetch），
      只要有 .jpg 封面懒加载就被击穿。补丁仅删除 IIFE 末尾的自动 scan 调用、保留
      window.HeoLivePhoto 导出，改由 IntersectionObserver 按需 scan(item)。升级 Heo
      时重新打补丁：删掉 IIFE 末尾 `if(document.readyState===...){...}else scan()` 两
      行即可。

  【自定义属性（DOM 解耦契约）】
    data-fancybox="live-gallery"  分组键，同组可左右滑动（必填）
    data-pvt      单文件实况图 .pvt（ZIP：封面 JPEG + MP4/MOV）
    data-cover    静态封面，缩略图与灯箱共用，保证秒开不空白、瀑布流不跳动
    data-video    动态视频 MP4/MOV（留空则回退到解包 data-pvt）
    data-caption  灯箱标题
    三种形态可混排：
      A. data-pvt="a.pvt"  data-cover="a.jpg"             单文件（本页示例）
      B. data-cover="a.jpg" data-video="a.mp4"            封面 + 视频分离（最省、无需 CORS）
      C. data-cover="a.jpg"                               纯静态图（无视频）
    素材解析优先级：data-video > 解包 data-pvt > 仅 data-cover。
    灯箱只从这些 data-* 读素材，绝不读缩略图 DOM —— Heo 怎么改写缩略图都不影响灯箱。

  【<img> 标记】
    class="live-photo"             Heo 识别目标（必填）
    src="<data-cover>"             用封面做 src，保证瀑布流有 intrinsic 尺寸、无破图
    data-live-pvt="<.pvt url>"     Heo 据此解出封面/视频 blob 并接管播放
    （Heo 也识别 img[src$=".pvt"]，但 .pvt 浏览器无法渲染会破图且布局塌陷，
     故用 data-cover 做 src + data-live-pvt 标记，效果等价、UX 更好。）

  【部署注意】
    1. <a> 不要写 href。Fancybox 会把 href 当素材来源读取（# 开头的还会被当成页面
       内元素克隆）。键盘可访问性由 role="button" + tabindex="0" + 脚本 keydown 接管。
    2. 容器列数写死 column-count（3 / 2 / 1），列间距 16px；断点 768px（平板）/480px（手机）。
    3. 相册项必须 display:block + break-inside:avoid，否则 CSS column 会把图片拦腰截断。
    4. Heo 运行时会把 <img> 包进匿名 <span> 并写 inline 样式，所以 .lp-item > span 与
       .lp-item .live-photo 两条规则必须 !important；选择器不能加自定义类名（那个 span 无 class）。
    5. 图片只设 width:100% + height:auto + object-fit:contain，绝不设 height /
       aspect-ratio / object-fit:cover，才不会裁切或拉伸 → 瀑布流高低不一、宽窄自然。
    6. 视频必须同时带 muted + playsinline + autoplay，否则移动端不会自动播放；
       自动播放被拦截时静默降级为封面（带 Ken Burns 动效），不报错。
    7. 跨域引用 .pvt 时托管方必须允许 CORS（fetch 需读到完整字节流）；data-video 的
       <video> 标签不需要 CORS。
    8. 两个写死的时序常量：Heo 长按阈值 260ms（在其源码里）、本脚本长按判定 300ms
       （LONG_PRESS_MS）。需要调只改后者。
    9. CSS column 的 DOM 顺序是按列向下排的，Fancybox 分组顺序跟随 DOM，所以灯箱内
       左右顺序是按列顺序，不是从左到右的阅读顺序。
   10. 本地化的 Fancybox 6.0.29 没有 done / contentClick 选项名：
       · 「灯箱打开完成」用 Carousel.contentReady 事件（slide 内容就绪的准确钩子）；
       · 「点内容不关闭」用可 preventDefault 取消的 backdropClick 事件实现。
   11. 独立部署时：把 ../../public/fancybox/fancybox.min.css 与 fancybox.umd.min.js 复制到
       本目录或任意同源路径，改 <link>/<script> 的 href/src 即可；lib/heolivephoto.js 已随本目录附带。
   12. 本页 3 个示例素材来自 src/content/galleries/person-life/（.pvt + .jpg 同名），
       在仓库根（astro-gyoza/）起静态服务器（如 `python -m http.server 4399`）即可解析
       相对路径 ../../src/... 与 ../../public/fancybox/...。。
════════════════════════════════════════════════════════════════════════════ -->
  </body>
</html>

<html lang="zh-CN">

    <meta charset="UTF-8" />

    <title>实况瀑布流相册 — HeoLivePhoto + Fancybox 6</title>

    <!-- ============================================================================
  ① 依赖引入
  ----------------------------------------------------------------------------
  HeoLivePhoto：负责缩略图播放（.pvt 解包 / Motion Photo / 封面+视频分离）
  Fancybox 6  ：负责灯箱放大、分组、左右滑动、键盘导航
  两者都是原生 JS、零依赖，不需要 jQuery，也不需要 Masonry（瀑布流是纯 CSS column）。

  顺序：两个依赖必须在页面底部那段初始化脚本之前加载完成。
  生产环境建议本地化两个文件（避免广告拦截/跟踪防护静默拦截 CDN 导致功能失效）；
  若页面跑在 Swup 等 SPA 路由里，两个 script 都要加 data-swup-ignore-script，
  否则每切一次页都会被重跑一遍，Fancybox 会被重定义成全新实例（监听器全部丢失）。
============================================================================ -->
    <link rel="stylesheet" href="/fancybox/fancybox.min.css" />

    <!-- ② 样式：CSS 原生多列瀑布流 -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: #f4f5f2;
        color: #1c1c1e;
        font-family:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #10131a;
          color: #f2f2f0;
        }
      }

      .lp-page {
        max-width: 1160px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      .lp-head h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
      }
      .lp-head p {
        margin: 0 0 24px;
        font-size: 0.875rem;
        opacity: 0.6;
      }

      /* -------- 瀑布流容器：CSS column 布局，列数响应式 -------- */
      .lp-waterfall {
        column-count: 3; /* 桌面端 3 列 */
        column-gap: 16px; /* 列间距 16px */
        column-fill: auto;
      }
      @media (max-width: 1024px) {
        .lp-waterfall {
          column-count: 2;
        }
      } /* 平板 2 列 */
      @media (max-width: 640px) {
        .lp-waterfall {
          column-count: 1;
        }
      } /* 手机 1 列 */

      /* -------- 单个相册项 -------- */
      .lp-item {
        position: relative;
        display: block; /* 必须块级，column 布局才不会塌 */
        width: 100%;
        margin: 0 0 16px; /* 项间距 */
        padding: 0;
        border-radius: 14px;
        overflow: hidden; /* 圆角裁切 + 播放时的 scale 缩放不外溢 */
        cursor: pointer;
        background: rgba(120, 130, 150, 0.14);
        break-inside: avoid; /* 防止图片被列截断 */
        -webkit-column-break-inside: avoid;
        page-break-inside: avoid;
        text-decoration: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        outline-offset: 3px;
        transition:
          transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s ease;
      }
      .lp-item:hover,
      .lp-item:focus-visible {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
      }

      /* -------- 兼容 HeoLivePhoto 自动生成的匿名包裹层 --------
     Heo 运行时会把 <img> 包进 <span style="display:inline-block;max-width:100%">
     并给 <img> 写 inline 的 width:100%/height:auto。inline 样式压过普通 CSS，
     所以这里必须 !important；而且选择器不能带自定义类名 —— 那个 span 没有 class。 */
      .lp-item > span {
        display: block !important;
        width: 100% !important;
        height: auto !important; /* 高度自适应，不强制固定高度 */
        overflow: hidden !important;
        line-height: 0;
      }

      /* -------- 实况图：严格按原始比例渲染，无裁切、无拉伸 -------- */
      .lp-item .live-photo {
        display: block !important;
        width: 100% !important;
        height: auto !important; /* 由图片 intrinsic 尺寸决定，永远不会被裁 */
        max-width: 100% !important;
        object-fit: contain !important;
        margin: 0 !important;
        vertical-align: bottom;
      }

      /* -------- 灯箱内的实况播放器 -------- */
      .lp-player {
        position: relative;
        display: block;
        margin: 0 auto;
        line-height: 0;
        background: #000;
        min-width: 220px;
        min-height: 140px;
      }
      .lp-cover {
        display: block;
        max-width: min(92vw, 1280px);
        max-height: min(78vh, 900px);
        width: auto;
        height: auto;
        object-fit: contain; /* 保持原始比例，不裁切不拉伸 */
        margin: 0;
        border: 0;
      }
      .lp-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        margin: 0;
        border: 0;
        opacity: 1;
        transition: opacity 0.25s ease;
      }
      .lp-video.is-waiting {
        opacity: 0;
      } /* 解码完成前继续显示封面，避免黑屏闪烁 */
      .lp-spin {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.28);
        border-top-color: #fff;
        animation: lp-spin 0.8s linear infinite;
      }
      @keyframes lp-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .lp-item,
        .lp-video {
          transition: none;
        }
        .lp-spin {
          animation-duration: 1.6s;
        }
      }
    </style>

      <!-- ============================================================================
    ③ HTML 结构
    ----------------------------------------------------------------------------
    每个相册项是一个 <a>，注意两点：
      · 不要写 href —— Fancybox 会把 href 当作品素材来源（#开头的还会被当成
        页面内元素克隆），这里素材一律走 data-*，所以 <a> 保持无 href，
        用 role="button" + tabindex="0" 补上键盘可访问性。
      · data-type="html" 必须写 —— 它告诉 Fancybox「这张 slide 是自定义 HTML」，
        否则 Fancybox 会按 src 后缀去猜类型。

    属性清单：
      data-fancybox="live-gallery"  分组键，同组内可左右滑动（必填）
      data-type="html"              声明自定义 HTML 内容（必填）
      data-pvt    —— 单文件实况图 .pvt（ZIP：封面 JPEG + MP4/MOV）
      data-cover  —— 静态封面（缩略图与灯箱都用它，保证秒开不空白）
      data-video  —— 动态视频（MP4 / MOV）
      data-motion —— 标记这是 Motion Photo（单张 .jpg 内嵌 MP4）
      data-caption—— 灯箱标题

    三种数据形态任选其一，可混排：
      A. data-pvt="a.pvt"                          单文件
      B. data-cover="a.jpg" data-video="a.mp4"     封面 + 视频分离
      C. data-cover="a.jpg" data-motion="1"        Motion Photo

    关键设计：Fancybox 只从这些 data-* 读素材，绝不读缩略图 DOM。
    缩略图里的 <img> 只是 HeoLivePhoto 的识别目标，Heo 初始化后会把它改写
    （包一层 span、改 inline 样式、.pvt 项还会把 src 换成 blob 封面）—— 但这
    完全不影响灯箱，这就是「DOM 解耦」的意义：即使某张图还没被 Heo 初始化
    （懒加载没轮到），点它照样能放大。
============================================================================ -->

  ④ 依赖脚本 + ⑤ JS 逻辑
============================================================================ -->
    <script src="/livephoto/heolivephoto.js"></script>
    <script src="/fancybox/fancybox.umd.min.js"></script>

    <script>
      ;(function () {
        'use strict'

        var GROUP = 'live-gallery'
        var SELECTOR = '[data-fancybox="' + GROUP + '"]'

        // ---------------------------------------------------------------------------
        // 0. 工具
        // ---------------------------------------------------------------------------
        function escapeAttr(value) {
          return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
          })
        }

        function absolutize(url) {
          try {
            return new URL(url, document.baseURI).href
          } catch (e) {
            return url
          }
        }

        // 缩略图里 Heo 已经解出来的资源（有就是零请求复用，没有就跳过）
        function thumbBlob(item, kind) {
          var node = item.querySelector(
            kind === 'video' ? 'video[src^="blob:"]' : 'img[src^="blob:"]',
          )
          return node && node.src ? node.src : null
        }

        // ---------------------------------------------------------------------------
        // 1. 最小 .pvt 解包器
        //    .pvt 是 ZIP 包（封面 JPEG + 视频 MP4/MOV）。灯箱要播视频、而作者只给了
        //    data-pvt 没给 data-video 时，就得自己解一次。解出的 objectURL 会缓存，
        //    同一文件全页只下载解析一次。
        // ---------------------------------------------------------------------------
        var pvtCache = Object.create(null)

        function unpackPvt(url) {
          if (pvtCache[url]) return pvtCache[url]

          var task = fetch(url)
            .then(function (response) {
              if (!response.ok) throw new Error('.pvt HTTP ' + response.status)
              return response.arrayBuffer()
            })
            .then(function (buffer) {
              var bytes = new Uint8Array(buffer)
              var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength)
              var tail = -1

              // 从文件尾部反向找 EOCD（End of Central Directory）记录
              for (var i = bytes.length - 22; i >= Math.max(0, bytes.length - 65558); i--) {
                if (view.getUint32(i, true) === 0x06054b50) {
                  tail = i
                  break
                }
              }
              if (tail < 0) throw new Error('.pvt 不是合法的 zip 包')

              var entries = view.getUint16(tail + 10, true)
              var cursor = view.getUint32(tail + 16, true)
              var decoder = new TextDecoder()
              var cover = null
              var video = null

              for (var n = 0; n < entries; n++) {
                var method = view.getUint16(cursor + 10, true)
                var csize = view.getUint32(cursor + 20, true)
                var nameLen = view.getUint16(cursor + 28, true)
                var extraLen = view.getUint16(cursor + 30, true)
                var commentLen = view.getUint16(cursor + 32, true)
                var localHead = view.getUint32(cursor + 42, true)
                var name = decoder.decode(bytes.subarray(cursor + 46, cursor + 46 + nameLen))
                cursor += 46 + nameLen + extraLen + commentLen

                var base = name.split('/').pop() || ''
                if (!cover && /\.(jpe?g|webp|png)$/i.test(base)) {
                  cover = { method: method, head: localHead, size: csize }
                } else if (!video && /\.(mp4|mov)$/i.test(base)) {
                  video = { method: method, head: localHead, size: csize }
                }
                if (cover && video) break
              }
              if (!cover || !video) throw new Error('.pvt 内没有封面或视频')

              var extract = function (entry) {
                var start =
                  entry.head +
                  30 +
                  view.getUint16(entry.head + 26, true) +
                  view.getUint16(entry.head + 28, true)
                var data = bytes.subarray(start, start + entry.size)
                if (entry.method === 0) return Promise.resolve(new Blob([data]))
                if (entry.method === 8 && typeof DecompressionStream === 'function') {
                  return new Response(
                    new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')),
                  ).blob()
                }
                return Promise.reject(new Error('不支持的 zip 压缩方式 ' + entry.method))
              }

              return Promise.all([extract(cover), extract(video)]).then(function (parts) {
                return {
                  cover: URL.createObjectURL(parts[0]),
                  video: URL.createObjectURL(parts[1]),
                }
              })
            })

          pvtCache[url] = task
          task.catch(function () {
            delete pvtCache[url]
          })
          return task
        }

        // ---------------------------------------------------------------------------
        // 2. 数据归一化：把自定义 data-* 翻译成 HeoLivePhoto 认得的属性
        //    自定义 data-* 是对外的稳定契约；Heo 的 data-live-* 是内部实现细节，
        //    两者在这一层解耦 —— 以后换播放器库只改这里。
        // ---------------------------------------------------------------------------
        var items = Array.prototype.slice.call(document.querySelectorAll(SELECTOR))
        var itemMap = Object.create(null)

        function isLiveItem(item, image) {
          return !!(
            item.hasAttribute('data-pvt') ||
            image.hasAttribute('data-live-pvt') ||
            image.hasAttribute('data-live-video') ||
            item.hasAttribute('data-motion')
          )
        }

        function normalizeItem(item, index) {
          var pvt = item.getAttribute('data-pvt')
          var cover = item.getAttribute('data-cover')
          var video = item.getAttribute('data-video')

          item.id = item.id || 'lp-item-' + index
          itemMap[item.id] = item

          var image = item.querySelector('img')
          if (!image) return false
          if (!image.classList.contains('live-photo')) image.classList.add('live-photo')

          // 没有实况形态 → 纯静态图，永不交给 Heo。
          // Heo 自己的全局 scan 只会把 src 以 .jpg/.jpeg/blob: 结尾的 img 当作
          // Motion Photo 候选，并**整份下载一遍**去探测内嵌 MP4；
          // 所以静态图请优先用 .webp / .png / .avif，那种后缀 Heo 直接跳过，
          // 一个多余请求都不会发。
          if (!pvt && !video && !item.hasAttribute('data-motion')) return false

          // 缩略图统一用 data-cover 垫底，保证秒开不空白
          if (cover && image.getAttribute('src') !== cover) image.setAttribute('src', cover)

          if (pvt) {
            // 单文件：封面由 Heo 解包后写入，src 先保留 data-cover
            if (!image.hasAttribute('data-live-pvt')) image.setAttribute('data-live-pvt', pvt)
          } else if (video) {
            // 封面 + 视频分离
            if (!image.hasAttribute('data-live-video')) image.setAttribute('data-live-video', video)
          } else {
            // Motion Photo：单张 jpg 内嵌视频，打个标记让 Heo 去探测
            if (!image.hasAttribute('data-live-motion')) image.setAttribute('data-live-motion', '')
          }
          return true
        }

        // ---------------------------------------------------------------------------
        // 3. 灯箱素材解析（唯一入口，全部来自 data-*，DOM 仅作零请求复用）
        //    优先级：
        //      ① data-video                       作者显式给的视频
        //      ② 缩略图里 Heo 已解出的 blob 视频   零额外请求（纯优化，非素材来源）
        //      ③ 自行解包 data-pvt                带缓存，重复打开不重复下载
        //      ④ 都没有 → 静态封面
        // ---------------------------------------------------------------------------
        function resolvePlayerAssets(item) {
          var cover = item.getAttribute('data-cover')
            ? absolutize(item.getAttribute('data-cover'))
            : thumbBlob(item, 'img')
          var pvt = item.getAttribute('data-pvt') ? absolutize(item.getAttribute('data-pvt')) : null

          var video = item.getAttribute('data-video')
            ? absolutize(item.getAttribute('data-video'))
            : thumbBlob(item, 'video')

          if (video) return Promise.resolve({ cover: cover, video: video })

          if (pvt) {
            return unpackPvt(pvt).then(function (parts) {
              return { cover: parts.cover || cover, video: parts.video }
            })
          }

          // Motion Photo：视频嵌在 jpg 里面，靠 Heo 自己解。scan() 返回 Promise，
          // 解完再回头读缩略图里的 blob 视频（Heo 从不 revoke，blob 全页有效）
          if (
            item.hasAttribute('data-motion') &&
            typeof window.HeoLivePhoto !== 'undefined' &&
            typeof window.HeoLivePhoto.scan === 'function'
          ) {
            return Promise.resolve(window.HeoLivePhoto.scan(item))
              .then(function () {
                return { cover: cover, video: thumbBlob(item, 'video') }
              })
              .catch(function () {
                return { cover: cover, video: null }
              })
          }

          return Promise.resolve({ cover: cover, video: null })
        }

        // ---------------------------------------------------------------------------
        // 4. 灯箱内容骨架（同步渲染，只有封面；视频由 contentReady 阶段异步注入）
        // ---------------------------------------------------------------------------
        function buildSlideHtml(item) {
          var cover = item.getAttribute('data-cover')
          var caption = item.getAttribute('data-caption') || ''

          var html = '<div class="lp-player" data-lp-id="' + escapeAttr(item.id) + '">'
          if (cover) {
            html +=
              '<img class="lp-cover" src="' +
              escapeAttr(cover) +
              '" alt="' +
              escapeAttr(caption) +
              '" />'
          }
          return html + '</div>'
        }

        // ---------------------------------------------------------------------------
        // 5. 实况播放器：封面打底 + 视频覆盖，解码前保持封面可见
        // ---------------------------------------------------------------------------
        var activePlayers = []

        function mountLivePlayer(player, item) {
          // 同一张 slide 重复触发（切走再切回来）时不叠加，直接把视频重新播起来
          var existing = player.querySelector('.lp-video')
          if (existing) {
            resumeVideo(existing, player)
            return
          }

          var needsWork =
            item.hasAttribute('data-pvt') ||
            item.hasAttribute('data-video') ||
            item.hasAttribute('data-motion') ||
            thumbBlob(item, 'video')

          if (!needsWork) return

          if (!player.querySelector('.lp-cover')) showSpin(player)

          resolvePlayerAssets(item)
            .then(function (assets) {
              if (!player.isConnected) return
              if (assets.cover) setCover(player, assets.cover)
              if (assets.video) attachVideo(player, assets.video)
              hideSpin(player)
            })
            .catch(function (error) {
              hideSpin(player)
              console.error('[live-photo-waterfall] 实况素材加载失败：', error)
            })
        }

        function setCover(player, url) {
          var image = player.querySelector('.lp-cover')
          if (!image) {
            image = document.createElement('img')
            image.className = 'lp-cover'
            image.alt = ''
            player.insertBefore(image, player.firstChild)
          }
          if (image.getAttribute('src') !== url) image.setAttribute('src', url)
        }

        function showSpin(player) {
          if (player.querySelector('.lp-spin')) return
          var spin = document.createElement('div')
          spin.className = 'lp-spin'
          player.append(spin)
        }

        function resumeVideo(node, player) {
          // 切走时这条记录会被 prunePlayers 拿掉，重新播之前得重新登记，
          // 否则下次切走就停不掉它了
          if (
            !activePlayers.some(function (record) {
              return record.player === player
            })
          ) {
            activePlayers.push({ player: player, video: node })
          }
          node.classList.add('is-waiting')
          showSpin(player)
          try {
            node.currentTime = 0
          } catch (error) {}
          var playPromise = node.play()
          if (playPromise && playPromise.catch) {
            playPromise.then(
              function () {
                node.classList.remove('is-waiting')
                hideSpin(player)
              },
              function () {
                node.classList.remove('is-waiting')
                hideSpin(player)
              },
            )
          } else {
            node.addEventListener('playing', function onPlaying() {
              node.removeEventListener('playing', onPlaying)
              node.classList.remove('is-waiting')
              hideSpin(player)
            })
          }
        }

        function hideSpin(player) {
          var spin = player.querySelector('.lp-spin')
          if (spin) spin.parentNode.removeChild(spin)
        }

        function attachVideo(player, url) {
          var node = document.createElement('video')
          node.className = 'lp-video is-waiting'
          node.setAttribute('playsinline', '')
          node.setAttribute('autoplay', '')
          node.setAttribute('loop', '')
          node.setAttribute('muted', '')
          node.muted = true
          node.loop = true
          node.playsInline = true
          node.preload = 'auto'
          node.src = url

          node.addEventListener('canplay', function onReady() {
            node.removeEventListener('canplay', onReady)
            node.classList.remove('is-waiting')
            hideSpin(player)
          })
          node.addEventListener('error', function () {
            hideSpin(player)
          })

          player.append(node)

          // 自动播放可能被浏览器拦下（用户还没和页面交互过），静默降级为封面
          var playPromise = node.play()
          if (playPromise && playPromise.catch) {
            playPromise.catch(function () {
              node.classList.remove('is-waiting')
              hideSpin(player)
            })
          }

          activePlayers.push({ player: player, video: node })
        }

        // ---------------------------------------------------------------------------
        // 6. 播放器生命周期：只让当前 slide 播放，切走 / 关闭一律停止
        //    Carousel 给当前 slide 加 is-selected 类，据此判断归属
        // ---------------------------------------------------------------------------
        function isCurrentSlide(player) {
          return !!(player.closest && player.closest('.is-selected'))
        }

        function stopPlayer(record) {
          try {
            if (record.video) {
              record.video.pause()
              record.video.removeAttribute('autoplay')
            }
          } catch (error) {}
          hideSpin(record.player)
        }

        function prunePlayers() {
          for (var i = activePlayers.length - 1; i >= 0; i--) {
            var record = activePlayers[i]
            var keep =
              record.player.isConnected &&
              (record.player === currentPlayer || isCurrentSlide(record.player))
            if (!keep) {
              stopPlayer(record)
              activePlayers.splice(i, 1)
            }
          }
        }

        var currentPlayer = null

        function stopAll() {
          activePlayers.forEach(stopPlayer)
          activePlayers.length = 0
          currentPlayer = null
        }

        // ---------------------------------------------------------------------------
        // 7. 懒加载初始化 HeoLivePhoto
        //    Heo 自己会在 DOMContentLoaded 时对**整个 document** 跑一次 scan()，
        //    所以首屏的图它自己会处理；这里的多重作用是给「后来才插入 DOM 的相册」
        //    （Swup 切页、AJAX 追加、无限滚动）一个补扫入口：滚到视口外 200px 就提前
        //    初始化，并且已经处理过的图（img.dataset.liveReady）直接跳过。
        // ---------------------------------------------------------------------------
        function initHeoFor(item) {
          var image = item.querySelector('img')
          if (!image || image.dataset.liveReady) return
          if (!isLiveItem(item, image)) return
          if (typeof window.HeoLivePhoto === 'undefined' || !window.HeoLivePhoto.scan) {
            console.error('[live-photo-waterfall] HeoLivePhoto 未加载，缩略图实况播放不可用')
            return
          }
          window.HeoLivePhoto.scan(item)
        }

        function setupLazyInit() {
          if (!('IntersectionObserver' in window)) {
            items.forEach(initHeoFor)
            return
          }

          var observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (!entry.isIntersecting) return
                initHeoFor(entry.target)
                observer.unobserve(entry.target) // 只初始化一次，之后不再监听
              })
            },
            {
              root: null,
              rootMargin: '200px 0px', // 提前 200px 预加载
              threshold: 0,
            },
          )

          items.forEach(function (item) {
            observer.observe(item)
          })
        }

        // ---------------------------------------------------------------------------
        // 8. 长按与点击的时序隔离
        //    Heo 的长按阈值是 260ms：touchstart 后 260ms 才开始播放，touchend 立刻
        //    取消并停止。但浏览器在长按释放后仍会派发一次 click，那次 click 会误开
        //    灯箱 —— 这是「长按播、点击放大」在触屏上唯一的真实冲突点。
        //    这里在 capture 阶段只拦「确实播放过」的那一次 click；短点击（<260ms）
        //    完全不受影响，所以交互依然是靠时长天然区分的。
        // ---------------------------------------------------------------------------
        var lastLongPressAt = 0

        function markIfPlaying(target) {
          var item = target && target.closest ? target.closest(SELECTOR) : null
          if (!item) return
          var video = item.querySelector('video')
          if (video && !video.paused) lastLongPressAt = Date.now()
        }

        document.addEventListener('touchend', markIfPlaying, { passive: true, capture: true })
        document.addEventListener('touchcancel', markIfPlaying, { passive: true, capture: true })

        document.addEventListener(
          'click',
          function (event) {
            if (!event.target || !event.target.closest) return
            var item = event.target.closest(SELECTOR)
            if (!item) return
            if (Date.now() - lastLongPressAt < 420) {
              // 420ms > 260ms 阈值，留出网络解码余量；stopPropagation 阻止冒泡到
              // Fancybox 挂在 body 上的监听器
              event.preventDefault()
              event.stopPropagation()
            }
          },
          true,
        )

        // 键盘可访问性：锚点没有 href（见 HTML 注释），需要自己接管 Enter / Space
        document.addEventListener(
          'keydown',
          function (event) {
            if (event.key !== 'Enter' && event.key !== ' ') return
            var item = event.target && event.target.closest ? event.target.closest(SELECTOR) : null
            if (!item) return
            event.preventDefault()
            item.click()
          },
          true,
        )

        // ---------------------------------------------------------------------------
        // 9. 初始化
        // ---------------------------------------------------------------------------
        // Carousel.* 事件会被 Fancybox 多包一层（第一个参数是 Fancybox 实例），
        // 而 slide 对象的位置随版本可能变化，所以这里按参数扫描而不是写死下标
        function activateSlide() {
          for (var argsIndex = 0; argsIndex < arguments.length; argsIndex++) {
            var candidate = arguments[argsIndex]
            if (!candidate || !candidate.el || !candidate.el.querySelector) continue
            var player = candidate.el.querySelector('.lp-player')
            if (!player) continue
            currentPlayer = player
            var item = itemMap[player.getAttribute('data-lp-id')]
            if (item) mountLivePlayer(player, item)
            break
          }
          prunePlayers()
        }

        function init() {
          var liveCount = 0
          items.forEach(function (item, index) {
            if (normalizeItem(item, index)) liveCount++
          })
          if (liveCount > 0) setupLazyInit()

          // 灯箱内容全部由 data-* 生成，与缩略图 DOM 完全无关
          items.forEach(function (item) {
            if (!item.dataset.html) item.dataset.html = buildSlideHtml(item)
          })

          if (typeof window.Fancybox === 'undefined') {
            console.error('[live-photo-waterfall] Fancybox 未加载，灯箱不可用')
            return
          }

          window.Fancybox.bind(SELECTOR, {
            // 深色灯箱；保留遮罩点击关闭
            theme: 'dark',
            hideScrollbar: true,
            backdropClick: 'close',
            closeButton: 'auto',
            keyboard: { Escape: 'close', ArrowLeft: 'prev', ArrowRight: 'next' },

            Carousel: {
              infinite: true, // 分组内无限循环
              vertical: false, // 左右滑动切换，垂直滑动关闭由 dragToClose 负责
              adaptiveHeight: true, // 高度随内容变化
              slidesPerPage: 1,
              plugins: { Thumbs: null }, // 实况图没有缩略图条，关掉
            },

            on: {
              // 单张内容首次挂载 → 注入实况播放器（等价于其他库的 done 回调）
              'Carousel.contentReady': activateSlide,

              // 远端 slide 被重新挂回 DOM（切走再切回）→ 重新播放
              'Carousel.attachSlideEl': activateSlide,

              // 切换 / 滑动稳定后停掉非当前播放器
              'Carousel.change': function () {
                prunePlayers()
              },
              'Carousel.settle': function () {
                prunePlayers()
              },

              // 点击内容区域不关闭（只拦内容本身，遮罩点击仍然正常关闭）
              // 本仓库本地化的 Fancybox 6.0.29 没有 contentClick 选项，
              // 点内容触发的是可 preventDefault 取消的 backdropClick 事件
              backdropClick: function (instance, event) {
                var target = event.composedPath ? event.composedPath()[0] : event.target
                if (target && target.closest && target.closest('.lp-player')) {
                  event.preventDefault()
                }
              },

              close: stopAll,
              destroy: stopAll,
            },
          })
        }

        // 两个依赖脚本都排在这段脚本之前、且不是 async/defer，所以走到这里时
        // window.Fancybox / window.HeoLivePhoto 已经就位，直接同步初始化。
        // 这一点很关键：Heo 要等 DOMContentLoaded 才会跑它自己的全局 scan()，
        // 属性归一化必须在那之前完成，否则 data-live-pvt 看不到，.pvt 项会被
        // 当成普通 jpg 去探测 Motion Photo。
        init()
      })()
    </script>

    <!-- ============================================================================
  ⑥ 使用说明
  ----------------------------------------------------------------------------

  【依赖引入】
    <link rel="stylesheet" href="/fancybox/fancybox.min.css">
    <script src="/livephoto/heolivephoto.js"></script>
    <script src="/fancybox/fancybox.umd.min.js"></script>
    顺序要求：两个依赖必须在初始化脚本之前加载完成。
    两者均为原生 JS、零依赖，不需要 jQuery，也不需要 Masonry
    （瀑布流用纯 CSS column 实现）。
    生产环境建议本地化，避免广告拦截导致功能静默失效；页面跑在 Swup 等 SPA
    路由里时，两个 script 都要加 data-swup-ignore-script。

  【自定义属性】
    data-fancybox="live-gallery"  分组键，同组可左右滑动（必填）
    data-type="html"              声明自定义 HTML 内容（必填，缺了 Fancybox 会
                                  按 src 后缀猜类型）
    data-pvt      单文件实况图 .pvt（ZIP：封面 JPEG + MP4/MOV）
    data-cover    静态封面，缩略图与灯箱共用，保证秒开不空白
    data-video    动态视频 MP4 / MOV
    data-motion   标记 Motion Photo（单张 .jpg 内嵌 MP4）
    data-caption  灯箱标题
    三种形态可混排：
      A. data-pvt="a.pvt"                          单文件
      B. data-cover="a.jpg" data-video="a.mp4"     封面 + 视频分离
      C. data-cover="a.jpg" data-motion="1"        Motion Photo
    素材解析优先级：data-video > 缩略图已解出的 blob > 自行解包 data-pvt > 静态封面
    三种形态流量对比（同一张 818.9KB 的 Motion Photo，本地实测）：
      A. Motion Photo 现状    2 × 818.9KB = 1.64MB   <img> 下一次 + fetch 下一次
      B. 封面 + 视频分离      0.82MB               ← 最省，且 video 标签不需要 CORS
      C. .pvt 单文件          1.04MB               比现状省一半，但 fetch 仍需 CORS
      用旁边的 convert.mjs 可从 Motion Photo 一键拆出 B 和 C：
        node convert.mjs 图片.jpg [图片2.jpg ...] --out 输出目录 [--dry-run] [--pvt-only]
          --dry-run    只检测不写文件，先扫一批照片看哪些是 Motion Photo
          --pvt-only   只产 .pvt + 封面（不产单独视频，配 data-pvt 用，最省空间）
        默认产出 前缀.jpg / 前缀-video.mp4 / 前缀.pvt，零依赖。
      产物请放 public/ 下（用绝对路径引用）：放在 src/content/galleries/ 里会被
      [slug].astro 的 glob（/src/content/galleries/**/*.{jpg,jpeg,png,...}）扫进普通相册，
      导致 .jpg 被当成重复图片。
    纯静态图请优先用 .webp / .png / .avif：Heo 只对 src 以 .jpg/.jpeg/blob: 结尾
    的 img 发 Motion Photo 探测请求（会整份重下一遍），其他后缀直接跳过。

  【部署注意】
    1. <a> 不要写 href。Fancybox 会把 href 当作品素材来源读取（# 开头的还会被
       当成页面内元素去克隆），素材必须全部走 data-*。键盘可访问性由
       role="button" + tabindex="0" + 脚本里的 keydown 接管补齐。
    2. 容器列数写死 column-count（3 / 2 / 1），列间距 column-gap:16px。
    3. 相册项必须 display:block + break-inside:avoid，否则 CSS column 会把
       图片拦腰截断到下一列。
    4. Heo 运行时会把 <img> 包进匿名 <span> 并写 inline 样式，所以
       .lp-item > span 与 .lp-item .live-photo 两条规则必须带 !important；
       选择器也不能加自定义类名 —— 那个 span 没有 class。
    5. 图片只设 width:100% + height:auto + object-fit:contain，绝不设
       height / aspect-ratio / object-fit:cover，才不会裁切或拉伸。
    6. 视频必须同时带 muted + playsinline + autoplay，否则移动端不会自动播放；
       自动播放被拦截时静默降级为封面，不报错。
    7. 跨域引用 .pvt 时托管方必须允许 CORS（fetch 需要读到完整字节流）。
    8. 相册项建议加 data-no-swup，避免 Swup 把图片直链当页面预加载。
    9. CSS column 的 DOM 顺序是按列向下排的，Fancybox 分组顺序跟随 DOM，
       所以灯箱内左右顺序是按列顺序，不是从左到右的阅读顺序。
   10. 两个写死的时序常量：Heo 长按阈值 260ms（在其源码里）、本脚本的抑制
       窗口 420ms（第 8 节）。需要调只改后者。
   11. 本地化的 Fancybox 6.0.29 里没有 contentClick / Toolbar / Caption /
       Keyboard 这些选项名，点击内容不关闭是靠可取消的 backdropClick 事件实现的；
       若换回官方 CDN 版本，可把该 handler 换成 contentClick: false。
   12. Fancybox 6 公开入口是 open()，本地化这份包只有 show()。本脚本统一走
       bind() 委托绑定，不直接调用 open/show，因此两种版本都能用。
============================================================================ -->
  </body>
</html>

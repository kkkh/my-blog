<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>茗辰原 - 新评论通知</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f5ec;">

  <!-- 外层容器：浅绿背景（博客亮色主背景） -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f5ec;padding:32px 16px;">
    <tr>
      <td align="center">

        <!-- 主卡片：白色圆角卡片 -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background-color:#ffffff;border-radius:16px;border:1px solid #d5dcc6;box-shadow:0 8px 30px rgba(16,19,26,0.08);overflow:hidden;">

          <!-- 头部：深蓝渐变条 -->
          <tr>
            <td style="background:linear-gradient(135deg,#3b82f6,#2563eb);padding:22px 28px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <div style="font-size:17px;font-weight:700;color:#ffffff;letter-spacing:0.5px;">茗辰原 · 新评论通知</div>
                    <div style="font-size:12px;color:rgba(255,255,255,0.85);margin-top:4px;">茶香四溢，编程世界</div>
                  </td>
                  <td align="right" width="48">
                    <div style="width:44px;height:44px;border-radius:50%;background-color:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.35);text-align:center;line-height:44px;font-size:20px;">💬</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- 正文 -->
          <tr>
            <td style="padding:26px 28px 8px;">
              <div style="font-size:15px;color:#33373a;line-height:1.7;">
                您的文章收到了新的评论：
              </div>
            </td>
          </tr>

          <!-- 评论者信息 + 评论内容 -->
          <tr>
            <td style="padding:14px 28px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <!-- 头像 -->
                  <td width="44" valign="top" style="padding-right:12px;">
                    <img src="${IMG}" width="40" height="40" alt="avatar" style="width:40px;height:40px;border-radius:50%;border:2px solid #d5dcc6;display:block;" />
                  </td>
                  <!-- 昵称 + 元信息 -->
                  <td valign="top">
                    <div style="font-size:14px;font-weight:700;color:#2563eb;">${NICK}</div>
                    <div style="font-size:12px;color:#5f6b5a;margin-top:2px;">${MAIL} · IP：${IP}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- 评论内容块 -->
          <tr>
            <td style="padding:12px 28px 0;">
              <div style="background-color:#f2f5ec;border-left:3px solid #2563eb;border-radius:8px;padding:14px 16px;font-size:14px;color:#33373a;line-height:1.7;word-wrap:break-word;">
                ${COMMENT}
              </div>
            </td>
          </tr>

          <!-- 按钮 -->
          <tr>
            <td style="padding:22px 28px 0;">
              <a href="${POST_URL}" target="_blank" style="display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:10px 24px;border-radius:999px;">
                查看完整内容 →
              </a>
            </td>
          </tr>

          <!-- 底部 -->
          <tr>
            <td style="padding:24px 28px 22px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-top:1px solid #e9eddb;padding-top:14px;">
                    <div style="font-size:12px;color:#5f6b5a;line-height:1.6;">
                      <a href="${SITE_URL}" target="_blank" style="color:#2563eb;text-decoration:none;">${SITE_NAME}</a> ·
                      茶香四溢，编程世界<br />
                      这是一封系统自动发送的邮件，请勿直接回复。
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>

        <!-- 页脚 -->
        <div style="font-size:11px;color:#8a9483;text-align:center;margin-top:16px;">
          © ${SITE_NAME} · Powered by Twikoo
        </div>

      </td>
    </tr>
  </table>

</body>
</html>
